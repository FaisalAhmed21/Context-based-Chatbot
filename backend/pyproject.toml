[project]
name = "rag-chatbot-backend"
version = "0.1.0"
description = "Grounded PDF QA chatbot — FastAPI backend"
requires-python = ">=3.10"
dependencies = [
  "fastapi[standard]>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "python-multipart>=0.0.12",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "aiosqlite>=0.20.0",
  "alembic>=1.14.0",
  "pydantic-settings>=2.6.0",
  "httpx>=0.28.0",
  "qdrant-client>=1.12.0",
  "sse-starlette>=2.1.0",
  "python-dotenv>=1.0.1",
  "aiofiles>=24.1.0",
  "fastembed>=0.5.0",
  "google-auth>=2.35.0",
  "PyJWT>=2.9.0",
  "pymupdf4llm>=0.0.17",
  "pymupdf>=1.25.0",
]

[project.optional-dependencies]
# PDF parsing (Phase 0+)
ingestion = []
# Phase 2+ (Docling optional — heavy; pymupdf4llm is the default parser)
advanced = [
  "docling>=2.15.0",
  "langchain>=0.3.0",
  "langchain-community>=0.3.0",
  "langgraph>=0.2.0",
]
eval = [
  "ragas>=0.2.0",
  "datasets>=3.0.0",
]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py310"
